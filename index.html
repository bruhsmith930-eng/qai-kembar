function parentOf(t){return t.slice(0,t.lastIndexOf('/'))||'/'}
function nameOf(t){return t.slice(t.lastIndexOf('/')+1)}
function daftar(p,n){if(!DIRS[p])DIRS[p]=[];if(!DIRS[p].includes(n))DIRS[p].push(n)}
(function reparasi(){
 if(typeof DIRS!=='object'||DIRS===null||!DIRS['/'])DIRS=JSON.parse(JSON.stringify(DIRS_DEF));
 if(typeof FILES!=='object'||FILES===null)FILES={};
 if(!DIRS['/home'])DIRS['/home']=[];
 if(!DIRS['/home/aku'])DIRS['/home/aku']=[];
 if(!DIRS[cwd])cwd='/home/aku';
 let berubah=true,penjaga=0;
 while(berubah&&penjaga<50){berubah=false;penjaga++;
  Object.keys(DIRS).forEach(d=>{if(d!=='/'){const p=parentOf(d),n=nameOf(d);
   if(!DIRS[p]){DIRS[p]=[];berubah=true}
   if(DIRS[p].indexOf(n)<0){DIRS[p].push(n);berubah=true}}});
  Object.keys(FILES).forEach(f=>{const p=parentOf(f),n=nameOf(f);
   if(!DIRS[p]){DIRS[p]=[];berubah=true}
   if(DIRS[p].indexOf(n)<0){DIRS[p].push(n);berubah=true}})}
 try{localStorage.setItem('qai4D',JSON.stringify(DIRS));
  localStorage.setItem('qai4F',JSON.stringify(FILES));
  localStorage.setItem('qai4W',JSON.stringify(cwd))}catch(e){}
})();
function S(){try{
 localStorage.setItem('qai4D',JSON.stringify(DIRS));
 localStorage.setItem('qai4F',JSON.stringify(FILES));
 localStorage.setItem('qai4C',JSON.stringify(CAT));
 localStorage.setItem('qai4T',JSON.stringify(TODO));

 localStorage.setItem('qai4NM',JSON.stringify(NND));

 localStorage.setItem('qai4W',JSON.stringify(cwd));
 localStorage.setItem('qai5K',JSON.stringify(GEMKEY));
 localStorage.setItem('qai5M',JSON.stringify(MODE));}catch(e){}}
function path(a){return a.startsWith('/')?a:(cwd==='/'?'':cwd)+'/'+a}
function calc(e){e=e.replace(/,/g,'.');
 if(!/^[0-9\s+\-*/().^]+$/.test(e))return null;
 try{const v=Function('"use strict";return('+e.replace(/\^/g,'**')+')')();
 return typeof v==='number'&&isFinite(v)?Math.round(v*1e10)/1e10:null}catch(x){return null}}
function persen(a,b){return(parseFloat(a.replace(',','.'))*parseFloat(b.replace(',','.'))/100).toLocaleString('id-ID')}
function waktuStr(){return '🕐 '+new Date().toLocaleString('id-ID',{weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function dl(nama,isi){const b=new Blob([isi],{type:'text/plain'}),
 a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nama;
 document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
async function gemini(teks){
 const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+
  GEMMODEL+':generateContent?key='+encodeURIComponent(GEMKEY),{
  method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({
   systemInstruction:{parts:[{text:'Kamu asisten AI dalam antarmuka terminal hijau. Jawab selalu bahasa Indonesia, hangat dan terstruktur (pakai poin bila perlu), jujur, dan akhiri sapaan pertama dengan menawarkan pengujian sesuatu.'}]},
   contents:[{parts:[{text:teks}]}]})});
 if(!r.ok)throw new Error('HTTP '+r.status+(r.status===400||r.status===403?' — cek /kunci':r.status===404?' — model berubah: /model nama-baru':''));
 const j=await r.json();
 const t=j&&j.candidates&&j.candidates[0]&&j.candidates[0].content&&
  j.candidates[0].content.parts&&
  j.candidates[0].content.parts[0]&&
  j.candidates[0].content.parts[0].text;
 if(!t)throw new Error('balikan kosong/terblokir keamanan');
 return t}
function tok(s){return s.toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean)}
function vec(t,V){const x=new Array(V.length+1).fill(0);
 tok(t).forEach(w=>{const i=V.indexOf(w);if(i>=0)x[i]=1});x[V.length]=1;return x}
function buildNet(){const V=[...new Set(NNDATA.flatMap(d=>tok(d.t)))],
 L=[...new Set(NNDATA.map(d=>d.l))],H=Math.min(16,Math.max(6,V.length)),
 r=()=>Math.random()*2-1;
 return{V,L,H,W1:Array.from({length:V.length+1},()=>Array.from({length:H},r)),
 b1:new Array(H).fill(0),
 W2:Array.from({length:H},()=>Array.from({length:L},r)),
 b2:new Array(L).fill(0)}}
function fwd(n,x){const h=[];
 for(let j=0;j<n.H;j++){let s=n.b1[j];
  for(let i=0;i<x.length;i++)s+=x[i]*n.W1[i][j];h[j]=Math.tanh(s)}
 const z=new Array(n.L.length).fill(0);
 for(let k=0;k<n.L.length;k++){let s=n.b2[k];
  for(let j=0;j<n.H;j++)s+=h[j]*n.W2[j][k];z[k]=s}
 const m=Math.max(...z),p=z.map(v=>Math.exp(v-m)),
 tt=p.reduce((a,b)=>a+b,0);return{h,p:p.map(v=>v/tt)}}
function latihNet(ep){
 if(NNDATA.length<2)return['err','Butuh minimal 2 contoh. Pakai: /ajar positif aku suka ini'];
 const labels=[...new Set(NNDATA.map(d=>d.l))];
 if(labels.length<2)return['err','Butuh minimal 2 LABEL berbeda agar otak bisa membedakan'];
 const n=buildNet(),lr=0.15,X=NNDATA.map(d=>vec(d.t,n.V)),
 Y=NNDATA.map(d=>n.L.indexOf(d.l));
 let loss=0;
 for(let e=0;e<ep;e++){loss=0;
  X.forEach((x,idx)=>{const t=Y[idx],f=fwd(n,x),h=f.h,p=f.p;
   loss+=-Math.log(Math.max(p[t],1e-9));
   const dz=p.map((v,k)=>v-(k===t?1:0));
   const dh=new Array(n.H).fill(0);
   for(let j=0;j<n.H;j++)for(let k=0;k<n.L.length;k++)dh[j]+=dz[k]*n.W2[j][k];
   for(let k=0;k<n.L.length;k++){n.b2[k]-=lr*dz[k];
    for(let j=0;j<n.H;j++)n.W2[j][k]-=lr*h[j]*dz[k]}
   for(let j=0;j<n.H;j++){const g=dh[j]*(1-h[j]*h[j]);n.b1[j]-=lr*g;
    for(let i=0;i<x.length;i++)n.W1[i][j]-=lr*x[i]*g}});
  loss/=X.length}
 NND=n;S();
 return['ok','🏋️ Training selesai — '+ep+' epoch. Loss akhir: '+loss.toFixed(4)+
 (loss<0.05?' ✅ OTAK PAHAM!':loss<0.3?' 📖 mulai paham.':' 🐌 tambah contoh, /latih ulang')+
 '\nOtak: '+n.V.length+' kata, '+n.H+' neuron, label: '+n.L.join(', ')+
 '\nUji: /prediksi <kalimat>']}
function selfTest(){
 const r=[];
 const t=(n,f)=>{try{r.push((f()?'✅ ':'❌ ')+n)}catch(e){r.push('❌ '+n+' ('+e.message+')')}};
 t('Penyimpanan permanen (localStorage)',()=>{localStorage.setItem('qaiT','1');
  const v=localStorage.getItem('qaiT')==='1';localStorage.removeItem('qaiT');return v});
 t('Crypto asli (password/acak)',()=>{const a=new Uint32Array(4);
  crypto.getRandomValues(a);return a.some(x=>x>0)});
 t('Mesin unduhan (Blob+URL)',()=>typeof Blob==='function'&&typeof URL.createObjectURL==='function');
 t('Kalkulator',()=>calc('2+2')===4&&calc('12*8')===96&&calc('(2+3)^2')===25&&calc('1/0')===null);
 t('Filesystem konsisten penuh',()=>{let ok=!!(DIRS['/']&&DIRS['/home']&&DIRS['/home/aku']);
  Object.keys(FILES).forEach(f=>{const p=parentOf(f);
   if(!DIRS[p]||DIRS[p].indexOf(nameOf(f))<0)ok=false});
  Object.keys(DIRS).forEach(d=>{if(d!=='/'){const p=parentOf(d);
   if(!DIRS[p]||DIRS[p].indexOf(nameOf(d))<0)ok=false}});
  return ok});
 t('Posisi terminal valid',()=>!!DIRS[cwd]);
 if(NND){t('Neural network (aktif)',()=>{const f=fwd(NND,vec(NNDATA.length?NNDATA[0].t:'aku',NND.V));
  return Math.abs(f.p.reduce((a,b)=>a+b,0)-1)<1e-6})}
 else r.push('⏸ Neural: menunggu /ajar & /latih (bukan kesalahan)');
 t('Jembatan Gemini (fetch API)',()=>typeof fetch==='function');
 t('Router: tanya vs perintah vs hitung',()=>proses('siapa kamu')[0]==='ok'&&
  proses('hitung 2+2')[0]==='ok'&&proses('mkdir x')[0]==='err');
 t('Renderer textContent (anti-XSS, by design)',()=>true);
 const gagal=r.filter(x=>x.charAt(0)==='❌').length;
 return['ok','🧪 SELF-TEST QAI v6.4\n\n'+r.join('\n')+'\n\n'+
 (gagal?'⚠ '+gagal+' komponen bermasalah — kirim screenshot baris ❌ ke Qwen.':'✅ SEMUA KOMPONEN SIAP — app layak dipakai harian. 👑')]}
