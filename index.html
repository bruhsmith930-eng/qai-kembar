function idxWs(s){for(let i=0;i<s.length;i++){var c=s.charAt(i);

for(let j=i-1;j>=0;j--){var ch=s.charAt(j);if(ch!==' '){sb=ch;break}}
for(let j=i+1;j<s.length;j++){var ch2=s.charAt(j);if(ch2!==' '){sd=ch2;break}}

return false}
function calc(e){e=e.split(',').join('.');

function vec(t,V){const x=new Array(V.length+1).fill(0);
tok(t).forEach(function(w){const i=V.indexOf(w);if(i>=0)x[i]=1});x[V.length]=1;return x}
function buildNet(){const V=[...new Set(NNDATA.flatMap(function(d){return tok(d.t)}))],
L=[...new Set(NNDATA.map(function(d){return d.l}))],H=Math.min(16,Math.max(6,V.length)),
r=function(){return Math.random()*2-1};
return{V:L.length?V:[],L:L,H:H,W1:Array.from({length:V.length+1},function(){return Array.from({length:H},r)}),

b2:new Array(L).fill(0)}}
function fwd(n,x){const h=[];
for(let j=0;j<n.H;j++){let s=n.b1[j];

for(let k=0;k<n.L.length;k++){let s=n.b2[k];
for(let j=0;j<n.H;j++)s+=h[j]*n.W2[j][k];z[k]=s}
const m=Math.max(...z),p=z.map(function(v){return Math.exp(v-m)}),
tt=p.reduce(function(a,b){return a+b},0);return{h:h,p:p.map(function(v){return v/tt})}}
function latihNet(ep){
if(NNDATA.length<2)return['err',`Butuh minimal 2 contoh. Pakai: /ajar positif aku suka ini`];
const labels=[...new Set(NNDATA.map(function(d){return d.l}))];
if(labels.length<2)return['err',`Butuh minimal 2 LABEL berbeda agar otak bisa membedakan`];
const n=buildNet(),lr=0.15,X=NNDATA.map(function(d){return vec(d.t,n.V)}),
Y=NNDATA.map(function(d){return n.L.indexOf(d.l)});
let loss=0;
for(let e=0;e<ep;e++){loss=0;
X.forEach(function(x,idx){const t=Y[idx],f=fwd(n,x),h=f.h,p=f.p;
loss+=-Math.log(Math.max(p[t],1e-9));
const dz=p.map(function(v,k){return v-(k===t?1:0)});

for(let j=0;j<n.H;j++)for(let k=0;k<n.L.length;k++)dh[j]+=dz[k]*n.W2[j][k];
for(let k=0;k<n.L.length;k++){n.b2[k]-=lr*dz[k];
for(let j=0;j<n.H;j++)n.W2[j][k]-=lr*h[j]*dz[k]}
for(let j=0;j<n.H;j++){const g=dh[j]*(1-h[j]*h[j]);n.b1[j]-=lr*g;
for(let i=0;i<x.length;i++)n.W1[i][j]-=lr*x[i]*g}});

`\nOtak: `+n.V.length+` kata, `+n.H+` neuron, label: `+n.L.join(', ')+
