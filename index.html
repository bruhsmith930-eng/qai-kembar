<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Kembaranku</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  body { background:linear-gradient(135deg,#0f0c29,#302b63,#24243e); height:100vh; display:flex; justify-content:center; align-items:center; }
  .chat-box { width:90%; max-width:700px; height:85vh; background:rgba(255,255,255,0.05); backdrop-filter:blur(20px); border-radius:20px; border:1px solid rgba(255,255,255,0.1); display:flex; flex-direction:column; overflow:hidden; }
  .header { padding:20px; text-align:center; color:#fff; background:rgba(255,255,255,0.05); }
  .header h1 { font-size:1.3em; background:linear-gradient(90deg,#a78bfa,#60a5fa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .header p { font-size:0.8em; color:#9ca3af; margin-top:4px; }
  #messages { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:80%; padding:12px 16px; border-radius:16px; color:#fff; font-size:0.95em; line-height:1.5; white-space:pre-wrap; animation:pop 0.3s ease; }
  @keyframes pop { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
  .user { align-self:flex-end; background:linear-gradient(135deg,#7c3aed,#4f46e5); border-bottom-right-radius:4px; }
  .ai { align-self:flex-start; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.1); border-bottom-left-radius:4px; }
  .input-area { display:flex; gap:10px; padding:16px; background:rgba(0,0,0,0.2); }
  #input { flex:1; padding:14px 18px; border-radius:12px; border:1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.08); color:#fff; font-size:0.95em; outline:none; }
  #input::placeholder { color:#9ca3af; }
  #send { padding:14px 24px; border:none; border-radius:12px; background:linear-gradient(135deg,#7c3aed,#4f46e5); color:#fff; font-weight:bold; cursor:pointer; transition:transform 0.15s; }
  #send:hover { transform:scale(1.05); }
  #send:disabled { opacity:0.5; cursor:wait; }
</style>
</head>
<body>
<div class="chat-box">
  <div class="header">
    <h1>🤖 AI Kembaranku</h1>
    <p>Ditenagai oleh Qwen3 • Otak Utama: Kamu & AI</p>
  </div>
  <div id="messages"></div>
  <div class="input-area">
    <input id="input" placeholder="Ketik perintah apa pun..." onkeydown="if(event.key==='Enter')kirim()">
    <button id="send" onclick="kirim()">Kirim</button>
  </div>
</div>

<script>
const SYSTEM_PROMPT = `Kamu adalah AI Kembaranku, asisten AI cerdas yang ramah, jujur, dan proaktif. Karaktermu:
1. GAYA: Hangat, emoji secukupnya, bahasa Indonesia santai tapi profesional.
2. PRINSIP: Selalu fokus pada SOLUSI. Jika ada permintaan berisiko, tetap bantu dengan alternatif terbaik — bukan menolak mentah-mentah.
3. KUALITAS: Jawaban terstruktur dan mengejar hasil terbaik.
4. JUJUR: Tidak mengarang fakta.
5. INISIATIF: Akhiri dengan saran langkah berikutnya.`;

let riwayat = [];
const messages = document.getElementById('messages');
const input = document.getElementById('input');
const btn = document.getElementById('send');

function tambahPesan(teks, tipe) {
  const div = document.createElement('div');
  div.className = 'msg ' + tipe;
  div.textContent = teks;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

async function kirim() {
  const teks = input.value.trim();
  if (!teks) return;
  
  input.value = '';
  btn.disabled = true;
  tambahPesan(teks, 'user');
  riwayat.push({ role: 'user', content: teks });
  
  const indikator = tambahPesan('🤔 Sedang berpikir...', 'ai');
  
  try {
    const res = await fetch('http://localhost:11434/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'qwen3:8b',
        messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...riwayat],
        stream: false
      })
    });
    const data = await res.json();
    const jawaban = data.message.content;
    riwayat.push({ role: 'assistant', content: jawaban });
    indikator.textContent = jawaban;
  } catch (e) {
    indikator.textContent = '⚠️ Tidak bisa terhubung ke otak AI. Pastikan Ollama berjalan (ollama serve) dan model sudah di-pull.';
  }
  
  btn.disabled = false;
  input.focus();
}
</script>
</body>
</html>
